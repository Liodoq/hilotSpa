services:
  db:
    image: postgres:15-alpine
    container_name: hilotspa_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: hilotspa_backend
    restart: on-failure
    ports:
      - "${SERVER_PORT:-8080}:8080"

    # Pass the WHOLE .env into the container. Listing variables one by one meant
    # that every new secret had to be remembered in two places — and JWT_SECRET
    # was not, so application.properties could not resolve
    # hilotspa.jwt.secret=${JWT_SECRET}, the context failed to start, and
    # restart: on-failure turned it into a silent crash loop with nothing
    # listening on 8080.
    env_file:
      - .env

    # These win over anything of the same name in .env (Compose gives
    # `environment` precedence over `env_file`). They exist because the values
    # that are correct on the host are wrong inside the compose network.
    environment:
      DB_HOST: db          # .env says localhost, which is correct for run.ps1
      DB_PORT: 5432        # the container talks to 5432 directly, not the published port
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # .env says http://localhost:5678, which is right for run.ps1 on Windows
      # but resolves to the backend container itself when running in compose.
      # Let a 4xx carry its REASON, not just "Bad Request". Read straight from
      # the environment (relaxed binding) as well as application.properties, so
      # it can be switched without rebuilding the image. B105.
      SERVER_ERROR_INCLUDE_MESSAGE: ${ERROR_INCLUDE_MESSAGE:-always}
      N8N_WEBHOOK_URL: http://n8n:5678
      # Let a chat fallback carry its reason to the browser. Development
      # machine only - remove this line before the system runs at the spa.
      HILOTSPA_ASSISTANT_EXPOSE_DEBUG: ${ASSISTANT_EXPOSE_DEBUG:-true}

    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # n8n — the orchestration layer for the Data-Driven Virtual Assistant.
  #
  # It lives in the same compose project on purpose. Two consequences:
  #   1. The backend reaches it at http://n8n:5678 (service name), NOT at
  #      localhost:5678 — inside a container, localhost is the container itself.
  #      That is why N8N_WEBHOOK_URL is overridden for the backend below.
  #   2. You reach the editor from Windows at http://localhost:5678 because the
  #      port is published.
  #
  # n8n never connects to Postgres. Spring sends it everything it is allowed to
  # know and n8n sends back a ranked list. See n8n/README.md.
  # ---------------------------------------------------------------------------
  n8n:
    # PINNED. 0.13 / B99. This tag is the version the n8n_data volume has
    # already been migrated to - confirmed with `docker compose exec n8n n8n
    # --version` before pinning, which is the only safe way to choose it. n8n
    # migrates its SQLite schema forward on upgrade and REFUSES TO START against
    # a database newer than the binary, so pinning to an older tag than the one
    # running would brick the assistant rather than protect it.
    #
    # It was :latest until 2 September. An earlier commit message claimed the
    # pin was done; it was not, and nobody checked. Verify with the command
    # above, not with the changelog.
    image: docker.n8n.io/n8nio/n8n:2.33.5
    container_name: hilotspa_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Manila
      TZ: Asia/Manila
      # No telemetry leaves the machine. Clinical data must not be phoned home.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Pinned so saved credentials survive a volume rebuild.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
