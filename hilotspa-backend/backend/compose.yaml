services:
  db:
    image: postgres:15-alpine
    container_name: hilotspa_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: hilotspa_backend
    restart: on-failure
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Inside the compose network the DB hostname is "db", not localhost.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_ID: ${NODE_ID}
      NODE_NAME: ${NODE_NAME}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    depends_on:
      - db

volumes:
  postgres_data:
