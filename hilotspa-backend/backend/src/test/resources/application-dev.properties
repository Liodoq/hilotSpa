# ---------------------------------------------------------------------------
# Test-only datasource override.
#
# WHY THIS FILE EXISTS.
#
# DevDataSeeder seeds ONLY into an empty database:
#
#     if (branchRepository.count() > 0) { ...; return; }
#
# So once a database has any branch in it, the seeder never corrects it again.
# A development database that has been worked in for months drifts away from
# the fixtures the tests assert on - a branch renamed, a therapist retired, a
# room deleted - and the suite starts failing for reasons that have nothing to
# do with the code under test. That is what happened on 4 October 2026: seven
# tests failed against a dev database holding one branch, while the seeder
# creates two.
#
# Tests now run against their own database. It starts empty, so Flyway
# migrates it and DevDataSeeder seeds it, and every run begins from the
# fixtures the assertions were written for. Nothing a test does can reach the
# data being used for development.
#
# WHY application-dev.properties AND NOT application.properties.
#
# A file named application.properties here would SHADOW the main one on the
# classpath rather than merge with it, and every other setting in it would
# vanish. A profile-specific file is merged OVER the base, so this overrides
# one property and leaves the rest alone. Every test class carries
# @ActiveProfiles("dev"), so this is loaded for all of them.
#
# This file lives only in src/test/resources, so it is not on the runtime
# classpath: running the app with run.ps1 still uses hilotspa_db as before.
#
# CREATE IT ONCE:
#   docker compose exec -T db sh -c 'psql -U $POSTGRES_USER -d postgres -c "CREATE DATABASE hilotspa_test"'
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${TEST_DB_NAME:hilotspa_test}
