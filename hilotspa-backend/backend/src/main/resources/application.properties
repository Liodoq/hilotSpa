spring.application.name=backend
server.port=${SERVER_PORT:8080}

# --- This node's identity (Sprint 3) ---
hilotspa.node.id=${NODE_ID:local-dev}
hilotspa.node.name=${NODE_NAME:Local Development}

# --- PostgreSQL. Values come from .env / environment. No secrets in this file. ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hilotspa_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- CORS origin for the Angular app ---
hilotspa.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
