spring.application.name=backend
server.port=${SERVER_PORT:8080}

# --- This node's identity (Sprint 3) ---
hilotspa.node.id=${NODE_ID:local-dev}
hilotspa.node.name=${NODE_NAME:Local Development}
# The branch THIS node writes for (task 3.31). Empty means "no branch of its
# own", which is what a single-node deployment looks like and is handled: the
# client falls back to the first branch exactly as it did before. On a
# multi-node deployment leaving this unset is a real fault - the node will file
# another branch's appointments - so it is announced at startup either way.
hilotspa.node.branch-id=${NODE_BRANCH_ID:}

# --- Peer sync (tasks 3.2 / 3.3) ---
# AN EMPTY TOKEN MEANS THE SYNC ENDPOINTS REJECT EVERYTHING. Both nodes publish
# 443 to the whole internet so Let's Encrypt can reach them, so an unset secret
# meaning "open" would put the peer API in front of anyone who can resolve the
# hostname. See SyncTokenFilter.
hilotspa.sync.token=${SYNC_TOKEN:}
# Comma-separated base URLs. Identity is DISCOVERED, not configured - a node id
# in here as well means two places can disagree about a node's name, and this
# is the one nobody re-reads.
hilotspa.sync.peers=${SYNC_PEERS:}
# 30s: 60 makes the screen look dead while somebody is watching it, 15 is
# needless traffic forever.
hilotspa.sync.poll-ms=${SYNC_POLL_MS:30000}

# Stage 3 - pulling a peer's log and applying it.
# Offset from the registry poll so a peer that is up but slow to serve its log
# cannot make itself look unreachable.
hilotspa.sync.pull-ms=${SYNC_PULL_MS:30000}
hilotspa.sync.pull-delay-ms=${SYNC_PULL_DELAY_MS:20000}
# A single switch to stop copying anything in, without unsetting the token and
# thereby also closing the endpoints a peer reads. Useful when one node is being
# rebuilt and you would rather it stayed still.
hilotspa.sync.enabled=${SYNC_ENABLED:true}

# --- PostgreSQL. Values come from .env / environment. No secrets in this file. ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hilotspa_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# Schema management - task 0.7 / R12.
#
# Both of these are env-driven ON PURPOSE, so the change is reversible without a
# rebuild. To go back to the old behaviour, put these two lines in .env:
#     FLYWAY_ENABLED=false
#     DDL_AUTO=update
#
# The target state is FLYWAY_ENABLED=true with DDL_AUTO=validate:
#   - Flyway owns the schema, as a numbered sequence every node applies identically.
#   - Hibernate VERIFIES rather than mutates. validate fails loudly at boot when an
#     entity and the migrations disagree, which is the whole point: the alternative
#     is a node that quietly reshapes its own database and drifts from its peers.
#
# baseline-on-migrate lets an EXISTING database - one ddl-auto built - adopt V1
# without trying to run it. A fresh clone runs V1 for real.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
# SQL logging. True in development, where it is how you see what Hibernate
# actually did; FALSE in production since 19 September, where the node poller
# runs every 30 seconds forever and would otherwise write three formatted
# queries a minute into an unbounded container log - drowning the lines you
# need during an incident and filling the disk eventually.
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:true}

# --- CORS origin for the Angular app ---
hilotspa.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}

# ---------------------------------------------------------------------------
# The spa, as the public site shows it.
#
# Config rather than hardcoded HTML: the trade name is still unresolved (SS A3 -
# "Knead Wellness Spa" vs the paper's "Hilotin Spa and Wellness Center"), and
# when the adviser settles it, one line changes instead of a page.
# ---------------------------------------------------------------------------
hilotspa.spa.name=${SPA_NAME:Knead Wellness Spa}
hilotspa.spa.tagline=${SPA_TAGLINE:Traditional hilot and bone setting in Bulan, Sorsogon}
hilotspa.spa.address=${SPA_ADDRESS:Bulan, Sorsogon, Philippines}
hilotspa.spa.phone=${SPA_PHONE:}
hilotspa.spa.hours=${SPA_HOURS:Open daily, 9:00 AM to 6:00 PM}
hilotspa.spa.facebook=${SPA_FACEBOOK:}
hilotspa.spa.maps-url=${SPA_MAPS_URL:}

# --- JWT ---
hilotspa.jwt.secret=${JWT_SECRET}
hilotspa.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# --- Assistant (Sprint 2) ---
# compose.yaml overrides N8N_WEBHOOK_URL to http://n8n:5678 for the container,
# because inside a container localhost is that container.
hilotspa.n8n.url=${N8N_WEBHOOK_URL:http://localhost:5678}
# A hanging AI call must never hold up a booking screen - but 5000 was not a
# timeout, it was a coin flip. Once the conversation narrows to one treatment
# the agent is handed that service's WHOLE calendar (up to 140 slots), and a
# Gemini call on a prompt that size does not come back inside five seconds. The
# symptom was "I am having trouble answering right now" on every turn AFTER the
# client settled a time, which read as the assistant breaking at the exact
# moment it mattered. Separate connect from read: refusing to connect is a dead
# n8n and should fail fast; a slow answer is just a slow answer.
hilotspa.n8n.timeout-ms=${N8N_TIMEOUT_MS:25000}
hilotspa.n8n.connect-timeout-ms=${N8N_CONNECT_TIMEOUT_MS:3000}
# When a fallback fires, may the response say why? OFF by default - at the spa
# a client must never see a stack trace. compose.yaml turns it on for the
# development machine, which is the only place anyone reads it.
hilotspa.assistant.expose-debug=${ASSISTANT_EXPOSE_DEBUG:false}

# Task 2.17 - both n8n webhooks are otherwise open to anything that can reach
# port 5678. Spring sends this header on every call; the Webhook nodes are
# configured with a matching Header Auth credential. Blank means the header is
# omitted and the backend WARNS at startup - acceptable on a dev laptop, never
# where a real client record exists.
hilotspa.n8n.auth-header=${N8N_WEBHOOK_AUTH_HEADER:X-HilotSpa-Key}
hilotspa.n8n.auth-secret=${N8N_WEBHOOK_SECRET:}

# --- Booking (Sprint 2) ---
# Times are Asia/Manila. The model has no clock and no timezone; every label it
# quotes is rendered here and passed to it as a string.
hilotspa.booking.timezone=${BOOKING_TZ:Asia/Manila}
hilotspa.booking.open-hour=${BOOKING_OPEN_HOUR:9}
hilotspa.booking.close-hour=${BOOKING_CLOSE_HOUR:18}
hilotspa.booking.slot-minutes=${BOOKING_SLOT_MINUTES:30}
hilotspa.booking.max-days=${BOOKING_MAX_DAYS:7}
# How many minutes before a visit the client's own Cancel button closes.
# Staff and admin are never subject to it.
hilotspa.booking.cancel-cutoff-minutes=${BOOKING_CANCEL_CUTOFF_MINUTES:60}

# A3 reports. How far back the admin report looks when no range is given.
hilotspa.reports.default-months=${REPORTS_DEFAULT_MONTHS:12}

# The slot hold (task 2.1). Redis holds a proposed time for a few minutes while
# the client chooses a therapist - the window a database constraint cannot cover,
# because no row exists yet.
#
# If Redis is unreachable NOTHING BREAKS: no hold is placed and booking behaves
# exactly as it did before this existed. That is deliberate - the hold sits on
# top of the EXCLUDE constraints, never in front of them, so its absence can
# never block a branch from booking. NFR#1.
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
hilotspa.hold.enabled=${HOLD_ENABLED:true}
hilotspa.hold.ttl-seconds=${HOLD_TTL_SECONDS:300}

# Turn OFF Redis repository scanning. We use StringRedisTemplate directly; there
# is not and will not be a Redis @Repository. Left on, the scanner inspects all
# fourteen JPA repositories at every boot and logs a paragraph about each one
# explaining that it is not a Redis repository - fourteen INFO lines that look
# like warnings and bury the line you actually read, "Started
# BackendApplication". It ends with "Found 0 Redis repository interfaces",
# which is the correct answer arrived at loudly.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# The two reminders (3.38), driven by each appointment rather than by the clock.
#
# A sweep every five minutes asks "what is due now?". A visit gets one email
# when it is LEAD_HOURS away and another when it is FINAL_LEAD_MINUTES away,
# both measured from its own start time. The old 9 AM batch told a 10 PM booking
# that it was "tomorrow" thirty-seven hours early, and never reached anything
# booked after 9 AM for the next morning at all.
#
# The sweep interval IS the accuracy: at five minutes the hour-before email
# lands 55-60 minutes ahead, which is why the wording says "about an hour".
hilotspa.reminders.sweep-ms=${REMINDERS_SWEEP_MS:300000}
# Let the app finish starting before the first sweep. A run against a half-warm
# context is a confusing way to find out the mail settings are wrong.
hilotspa.reminders.sweep-initial-ms=${REMINDERS_SWEEP_INITIAL_MS:60000}
hilotspa.reminders.lead-hours=${REMINDERS_LEAD_HOURS:24}
hilotspa.reminders.final-lead-minutes=${REMINDERS_FINAL_LEAD_MINUTES:60}
# The kill switch. Set false and nothing is sent automatically - the
# administrator's Send button still works, which is what makes a demo safe on a
# database of real clients. It is an env variable and not a literal for exactly
# that reason.
hilotspa.reminders.enabled=${REMINDERS_ENABLED:true}
hilotspa.reminders.max-attempts=${REMINDERS_MAX_ATTEMPTS:3}
hilotspa.reminders.from=${MAIL_FROM:}
hilotspa.reminders.reply-to=${MAIL_REPLY_TO:}

# --- Forgotten passwords (task 3.36) ---------------------------------------
# A reset link is single-use and short-lived. Thirty minutes is long enough to
# find the email on a phone and short enough that a message left open on a
# shared machine at the spa stops being a way in.
hilotspa.reset.ttl-minutes=${RESET_TTL_MINUTES:30}
# One link per account per minute. Not a security control on its own - it stops
# a form somebody is leaning on from mailing a client twenty times.
hilotspa.reset.min-interval-seconds=${RESET_MIN_INTERVAL_SECONDS:60}
# Where the link points. MUST be this node's own site: the token exists only in
# this node's database, so a link to the other branch opens a page that cannot
# redeem it. Left blank, the first FRONTEND_ORIGIN is used, which is by
# definition the site this API answers for - so on both nodes today the default
# is already correct and this only exists for the day one node answers on two
# hostnames at once.
hilotspa.reset.link-base=${RESET_LINK_BASE:}


# SMTP. Left EMPTY on purpose: with no host the reminder job writes a SKIPPED row
# saying so and sends nothing, so a fresh checkout boots and the log still
# demonstrates. Set these in .env on the server, never in this file.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Return the REASON with a 4xx, not just "Bad Request".
#
# Spring omits it by default, so every ResponseStatusException we raise - and we
# write them for humans ("branchId is required, and either userId or a walk-in
# name") - reached the browser as the bare status text. describeHttpError() was
# reading a `message` field the server was never sending, and a client watching
# a pre-assessment fail had nothing to act on and nothing to tell us.
#
# Env-driven like DDL_AUTO and FLYWAY_ENABLED, so a public deployment can turn
# it off in one line: exception messages are written by us and safe, but that is
# a promise worth being able to withdraw.
server.error.include-message=${ERROR_INCLUDE_MESSAGE:always}
