<div class="maplab">{{ view() }}</div>

<div class="figure" [class.ro]="!interactive()" [class.locked]="locked()"
     (click)="onPlace($event)" (mousemove)="onHover($event)" (mouseleave)="hover.set(null)"
     [attr.aria-label]="'Tap a marked position on the ' + view().toLowerCase() + ' of the body'">
  <svg viewBox="0 0 300 640" role="img" [attr.aria-label]="view() + ' view of the body'">
    <g fill="var(--color-sage-100)" stroke="var(--color-sage-300)" stroke-width="2.5" stroke-linejoin="round">
      <ellipse cx="150" cy="46" rx="34" ry="41" />
      <rect x="138" y="80" width="24" height="24" rx="9" />
      <rect x="88" y="98" width="124" height="58" rx="27" />
      <rect x="100" y="112" width="100" height="104" rx="30" />
      <rect x="104" y="198" width="92" height="94" rx="30" />
      <rect x="62" y="112" width="30" height="192" rx="15" />
      <rect x="208" y="112" width="30" height="192" rx="15" />
      <ellipse cx="77" cy="315" rx="15" ry="23" />
      <ellipse cx="223" cy="315" rx="15" ry="23" />
      <rect x="110" y="276" width="38" height="292" rx="19" />
      <rect x="152" y="276" width="38" height="292" rx="19" />
      <ellipse cx="129" cy="576" rx="19" ry="14" />
      <ellipse cx="171" cy="576" rx="19" ry="14" />
    </g>
    @if (view() === 'BACK') {
      <g stroke="var(--color-sage-300)" stroke-width="2" fill="none" stroke-linecap="round">
        <line x1="150" y1="108" x2="150" y2="286" />
        <path d="M118 140 C132 152 132 168 124 182" />
        <path d="M182 140 C168 152 168 168 176 182" />
      </g>
    } @else {
      <g stroke="var(--color-sage-300)" stroke-width="2" fill="none" stroke-linecap="round">
        <line x1="150" y1="150" x2="150" y2="200" />
        <path d="M126 214 C138 222 162 222 174 214" />
      </g>
    }

    <!--
      The markers live INSIDE the svg, in its own 300x640 coordinates.

      They used to be absolutely positioned DOM nodes laid over the figure, and
      twice they escaped it - floating to the bottom of the homepage card and
      beside the note on the admin assessment view, because their percentages
      were being resolved against some ancestor other than .figure. The third
      attempt is not another positioning rule to compete with whatever was
      winning: a child of an svg cannot be laid out anywhere but inside that
      svg's viewBox, so the failure has nowhere left to happen.

      It also earns something the old markers never had - the marks scale WITH
      the figure. Every page that showed a thumbnail had to hand-tune .mk down
      to 24px to stop a 50px marker swallowing a 92px body. None of that is
      needed now.
    -->
    @for (p of visible(); track p.key) {
      <g class="mark" [class]="'mark ' + sev(p.score) + (p.key === selectedKey() ? ' sel' : '')"
         [attr.role]="interactive() ? 'button' : null"
         [attr.tabindex]="interactive() ? 0 : null"
         [attr.aria-label]="'Spot ' + indexOf(p.key) + ', severity ' + p.score"
         (click)="onSelect($event, p.key)">
        <circle class="mhalo" [attr.cx]="p.x * 3" [attr.cy]="p.y * 6.4"
                [attr.r]="haloSize(p.score) / 2" />
        <circle class="dot" [attr.cx]="p.x * 3" [attr.cy]="p.y * 6.4" r="24" />
        <text [attr.x]="p.x * 3" [attr.y]="p.y * 6.4">{{ indexOf(p.key) }}</text>
      </g>
    }
  </svg>

  <!-- the positions you may mark, shown faintly so the map is discoverable -->
  @if (interactive()) {
    @for (h of spots(); track h.id) {
      <span class="pin" [class.taken]="isTaken(h.id)"
            [style.left.%]="h.x" [style.top.%]="h.y" aria-hidden="true"></span>
    }
  }

  <!-- hover preview: the circle that shows where the marker will land -->
  @if (interactive() && !locked() && hover(); as h) {
    @if (!isTaken(h.id)) {
      <span class="ghost" [style.left.%]="h.x" [style.top.%]="h.y" aria-hidden="true"></span>
      <span class="ghostlabel" [style.left.%]="h.x" [style.top.%]="h.y">{{ labelFor(h) }}</span>
    }
  }

</div>
