@if (net.degraded()) {
  <!-- Says what is true and nothing more. There is no service worker and no
       local write queue, so promising that anything will be sent later would be
       a lie the client discovers by turning up. What IS true is that a booking
       already made is on the server and unaffected. -->
  <div class="banner off" role="status">
    <span class="dotw"></span>{{ net.message('CUSTOMER') }}
  </div>
}

<header class="appbar">
  <a class="brand" [routerLink]="auth.token() ? '/home' : '/'" aria-label="Knead Wellness Spa, home">
    <app-logo [size]="58" />
    <span><b>Knead Wellness Spa</b><small>Bulan, Sorsogon</small></span>
  </a>

  <!-- The same bar serves signed-in clients and visitors. A visitor browsing
       the menu should not be shown "MY BOOKINGS", and a client should not be
       shown "Create account". -->
  @if (auth.token()) {
    <nav class="navlinks" aria-label="Main">
      <a routerLink="/home"     routerLinkActive="on">HOME</a>
      <a routerLink="/services" routerLinkActive="on">SERVICES</a>
      <a routerLink="/booking"  routerLinkActive="on">MY BOOKINGS</a>
      <a routerLink="/about"    routerLinkActive="on">ABOUT</a>
    </nav>
  } @else {
    <nav class="navlinks" aria-label="Main">
      <a routerLink="/"         routerLinkActive="on" [routerLinkActiveOptions]="{exact:true}">HOME</a>
      <a routerLink="/services" routerLinkActive="on">SERVICES</a>
      <a routerLink="/about"    routerLinkActive="on">ABOUT</a>
      <a routerLink="/contact"  routerLinkActive="on">CONTACT</a>
    </nav>

    <div class="account">
      <a class="btn btn-quiet btn-sm" routerLink="/login">Sign in</a>
      <a class="btn btn-primary btn-sm" routerLink="/register">Create account</a>
    </div>
  }

  @if (auth.token()) {
  <div class="account">
    <span style="font-size:19px;font-weight:500">{{ auth.fullName() || 'Guest' }}</span>
    <button type="button" class="avatar" [attr.aria-expanded]="open()" aria-haspopup="menu"
            [attr.aria-label]="'Account menu for ' + auth.fullName()"
            (click)="open.set(!open())">{{ initials() }}</button>

    @if (open()) {
      <!-- Clicking the avatar used to sign you out immediately. One stray click
           and the whole assessment was gone. It opens a menu now. -->
      <div class="menu" role="menu">
        <button type="button" role="menuitem" (click)="go('/home')">Home</button>
        <button type="button" role="menuitem" (click)="go('/account')">My account</button>
        <button type="button" role="menuitem" (click)="go('/profile')">My health details</button>
        <button type="button" role="menuitem" (click)="go('/booking')">My bookings</button>
        <hr class="hr">
        <button type="button" role="menuitem" class="danger" (click)="signOut()">Sign out</button>
      </div>
      <button type="button" class="scrim" aria-label="Close menu" (click)="open.set(false)"></button>
    }
  </div>
  }
</header>
